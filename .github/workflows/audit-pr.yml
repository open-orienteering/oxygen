name: Dependency audit (PR)
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/*/package.json"
      - "scripts/audit-prod.mjs"
      - ".github/workflows/audit-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm audit` (≤10.x) targets npm's retired legacy endpoint (410 since
      # 2026); scripts/audit-prod.mjs queries the bulk advisory endpoint the
      # way pnpm 11 does, without requiring the Node 22 toolchain bump.
      - name: Audit (production tree, fail on high/critical)
        run: pnpm run audit:prod
