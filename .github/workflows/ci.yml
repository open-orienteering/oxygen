name: CI

# A change that touches only docs (docs/**, any *.md) runs no CI at all: none
# of the jobs below reads them. docs/e2e-sharding.md "CI".
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRISMA_GENERATE_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=oxygen

jobs:
  unit:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      # API `tsc --noEmit` consumes `@oxygen/shared` via project references
      # (`packages/shared/dist`). Build first so a clean CI checkout matches
      # a local tree that has already been compiled.
      # qpdf + poppler-utils: `qpdf --check` and the PDF golden tier
      # (docs/course-print.md §9). Tests that need them skip locally when
      # the tools are missing but fail under CI.
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Helper script tests
        run: pnpm test:scripts

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      - name: Start test Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils
      - run: pnpm test:integration

  # The serial E2E suite split across runners (docs/e2e-sharding.md "CI"):
  # each matrix job is one isolated stack running one shard of the same LPT
  # split (scripts/e2e-sharded.mjs, E2E_SHARD_TOTAL / E2E_SHARD_INDEX). It
  # does not wait for `unit`: the shards start at once, beside lint and unit.
  # The shard count is the length of the `shard` list (1..N, no gaps;
  # scripts/__tests__/e2e-shards.test.mjs): E2E_SHARD_TOTAL is the job total.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      E2E_SHARD_TOTAL: ${{ strategy.job-total }}
      E2E_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      # Start Postgres early: its image pull and health wait overlap the
      # browser install below instead of following it (`--wait` comes last).
      - name: Start test Postgres
        run: docker compose -f docker-compose.test.yml up -d
      # The Chromium download is cached per Playwright version; on a hit only
      # the OS libraries it needs are installed (apt, not cacheable here).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Wait for test Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Run Playwright shard
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # The one E2E check the merge flow reads ("E2E tests"): green only when
  # every shard passed. Runs even when a shard failed, so the check reports
  # failure instead of staying skipped.
  e2e:
    name: E2E tests
    if: ${{ !cancelled() }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = success

  publish:
    name: Publish GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, e2e]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
