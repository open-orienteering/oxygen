name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRISMA_GENERATE_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=oxygen

jobs:
  unit:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      # API `tsc --noEmit` consumes `@oxygen/shared` via project references
      # (`packages/shared/dist`). Build first so a clean CI checkout matches
      # a local tree that has already been compiled.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Helper script tests
        run: pnpm test:scripts

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      - name: Start test Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: DATABASE_URL="$PRISMA_GENERATE_DATABASE_URL" pnpm db:generate
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Start test Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Run Playwright suite
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  publish:
    name: Publish GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, e2e]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
