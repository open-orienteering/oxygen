name: Publish GHCR image

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  ghcr:
    name: Build and push multi-arch cloud image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history with tags: build-version.mjs runs `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA_TAG="sha-${GITHUB_SHA}"
          # The version the image reports (docs/releases/README.md, "Tags"):
          # package.json on the release commit, `git describe` past a tag.
          VERSION="$(node scripts/build-version.mjs)"
          echo "Build version: ${VERSION}"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "sha_tag=${SHA_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: cloud
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_ID=${{ github.sha }}
            BUILD_REF=sha-${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the published SHA image
        env:
          COMPOSE_PROJECT_NAME: oxygen-ghcr-smoke
          OXYGEN_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          OXYGEN_PORT: "18080"
        run: bash scripts/demo.sh
      - name: Clean up smoke-test stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: oxygen-ghcr-smoke
          OXYGEN_PORT: "18080"
        run: docker compose -f docker-compose.release.yml down -v
      # The smoke passed: record it. release.yml promotes only a commit that
      # has this tag, so a tag on a commit whose smoke failed (or never ran)
      # cannot reach stable/latest.
      - name: Mark the SHA image verified
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:verified-${{ steps.meta.outputs.sha_tag }}" \
            "${IMAGE}:${{ steps.meta.outputs.sha_tag }}"
      # edge = the newest main commit that passed the smoke, and only while it
      # is still the code tip of main (scripts/edge-guard.mjs).
      - name: Move edge to this commit if it is still main's tip
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          git fetch --no-tags origin main
          if verdict="$(node scripts/edge-guard.mjs "${GITHUB_SHA}" origin/main)"; then
            echo "${verdict}"
            docker buildx imagetools create \
              --tag "${IMAGE}:edge" \
              "${IMAGE}:${{ steps.meta.outputs.sha_tag }}"
          else
            echo "::notice::edge not moved (${verdict})"
          fi
