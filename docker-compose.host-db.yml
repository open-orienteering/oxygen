# Use this when PostgreSQL is already running on the host machine.
#
# Both containers use host networking so the API can reach PG on 127.0.0.1.
# The web frontend is available on port 8080, the API on port 3001.
# The dev server uses port 3002 (API) and 5173 (Vite) to avoid collisions.
#
# Usage:
#   docker compose -f docker-compose.host-db.yml up --build
#
# Optionally override the DB URL:
#   DATABASE_URL="postgresql://oxygen:oxygen@127.0.0.1:5432/oxygen?schema=oxygen" \
#   docker compose -f docker-compose.host-db.yml up --build

services:
  api:
    build:
      context: .
      target: api
      network: host

    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://oxygen:oxygen@127.0.0.1:5432/oxygen?schema=oxygen}"
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      AUTH_MODE: "${AUTH_MODE:-off}"
      AUTH_HEADER: "${AUTH_HEADER:-x-forwarded-email}"
      AUTH_DEV_EMAIL: "${AUTH_DEV_EMAIL:-dev@localhost}"
      OXYGEN_ADMIN_EMAILS: "${OXYGEN_ADMIN_EMAILS:-}"
      # This stack shares the dev database with `pnpm dev` (AGENTS.md §3).
      # Its own lease scope keeps the two from stealing each other's
      # background timers — they are separate deployments, not peers.
      LEADER_LEASE_SCOPE: "docker"

  web:
    build:
      context: .
      target: web
      network: host

    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    volumes:
      - ./docker/nginx.host-db.conf:/etc/nginx/conf.d/default.conf:ro
