# Self-host Oxygen from the published image (API + web in one container).
#
#   docker compose -f docker-compose.release.yml up -d
#
# Pin a version with OXYGEN_IMAGE, e.g.:
#   OXYGEN_IMAGE=ghcr.io/open-orienteering/oxygen:v1.2.3 \
#     docker compose -f docker-compose.release.yml up -d
#
# Tags: stable (last GitHub Release), latest (same as stable), edge (main),
# sha-<full-commit>. See docs/releases-and-images.md.
#
# Development still uses docker-compose.yml / docker-compose.host-db.yml
# (build from source). Venue boxes still use docker-compose.venue.yml.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
      POSTGRES_DB: oxygen
    volumes:
      - postgres-release-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxygen -d oxygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
    command:
      - sh
      - -c
      - cd packages/api && node_modules/.bin/prisma migrate deploy

  oxygen:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      AUTH_MODE: "${AUTH_MODE:-off}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-release-data:
