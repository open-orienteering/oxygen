# Self-host Oxygen from the published image (API + web in one container).
#
#   docker compose -f docker-compose.release.yml up -d
#
# Pin a version with OXYGEN_IMAGE, e.g.:
#   OXYGEN_IMAGE=ghcr.io/open-orienteering/oxygen:v1.2.3 \
#     docker compose -f docker-compose.release.yml up -d
#
# Tags: stable (last GitHub Release), latest (same as stable), edge (main),
# sha-<full-commit>. See docs/releases/README.md.
#
# Development still uses docker-compose.yml / docker-compose.host-db.yml
# (build from source). Venue boxes still use docker-compose.venue.yml.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
      POSTGRES_DB: oxygen
    volumes:
      - postgres-release-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxygen -d oxygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    pull_policy: ${OXYGEN_PULL_POLICY:-always}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
    command:
      - sh
      - -c
      - cd packages/api && node_modules/.bin/prisma migrate deploy

  oxygen:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    pull_policy: ${OXYGEN_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${OXYGEN_PORT:-8080}:8080"
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
      PORT: "8080"
      TZ: "${TZ:-Europe/Stockholm}"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      AUTH_MODE: "${AUTH_MODE:-off}"
      OXYGEN_DEPLOY_REF: "${OXYGEN_DEPLOY_REF:-${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Automatic whole-database backups (docs/ops/backup-restore.md
  # "Automatic backups"): a pg_dump of the oxygen schema every 15 minutes
  # into ./backups next to this file, the newest 48 kept. Point
  # BACKUP_DIR at a USB stick to keep a copy off the box's disk.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: oxygen
      PGPASSWORD: oxygen
      PGDATABASE: oxygen
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-900}"
      BACKUP_KEEP: "${BACKUP_KEEP:-48}"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # docker/pg-backup.sh, inline: this file runs without a checkout.
    entrypoint:
      - sh
      - -c
      - |
        echo "pg-backup: every $${BACKUP_INTERVAL_SECONDS}s to /backups, keeping $${BACKUP_KEEP}"
        while true; do
          find /backups -maxdepth 1 -name 'oxygen_*.dump.partial' -type f -delete
          last="$$(ls -1t /backups/oxygen_*.dump 2>/dev/null | head -n 1)"
          need_kb=0
          if [ -n "$$last" ]; then need_kb=$$(( $$(wc -c < "$$last") * 2 / 1024 )); fi
          free_kb="$$(df -Pk /backups | awk 'NR == 2 { print $$4 }')"
          out="/backups/oxygen_$$(date -u +%Y%m%d_%H%M%S).dump"
          if [ "$${free_kb:-0}" -lt "$$need_kb" ]; then
            echo "pg-backup: SKIPPED: $$free_kb KiB free in /backups, need $$need_kb" >&2
          elif pg_dump --schema=oxygen --format=custom --file="$$out.partial"; then
            mv "$$out.partial" "$$out" && echo "pg-backup: wrote $$out"
            ls -1t /backups/oxygen_*.dump | tail -n +"$$(($${BACKUP_KEEP} + 1))" | while read -r old; do rm -f "$$old"; done
          else
            echo "pg-backup: pg_dump FAILED" >&2
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  postgres-release-data:
