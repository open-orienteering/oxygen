# Self-host Oxygen from the published image (API + web in one container).
#
# Pin a released version with OXYGEN_IMAGE (replace vX.Y.Z with the release
# you want; the tags are listed on the GitHub Releases page):
#   OXYGEN_IMAGE=ghcr.io/open-orienteering/oxygen:vX.Y.Z \
#     docker compose -f docker-compose.release.yml up -d
#
# Without OXYGEN_IMAGE the floating `stable` tag is used. An image already on
# the machine is reused (pull_policy missing), so `up -d` works offline and
# never changes the version by itself. To upgrade, follow docs/ops/venue-runbook.md
# "Upgrading the box" or docs/ops/backup-restore.md "Before an upgrade": pull, dump,
# then up -d. OXYGEN_PULL_POLICY=always makes `up` pull every time.
#
# Tags: stable (last GitHub Release), latest (same as stable), edge (a main
# commit that passed the image smoke), sha-<full-commit>. See
# docs/releases/README.md.
#
# Development still uses docker-compose.yml / docker-compose.host-db.yml
# (build from source). Venue boxes still use docker-compose.venue.yml.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
      POSTGRES_DB: oxygen
    volumes:
      - postgres-release-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxygen -d oxygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    pull_policy: ${OXYGEN_PULL_POLICY:-missing}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
    command:
      - sh
      - -c
      - cd packages/api && node_modules/.bin/prisma migrate deploy

  oxygen:
    image: ${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}
    pull_policy: ${OXYGEN_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${OXYGEN_PORT:-8080}:8080"
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
      PORT: "8080"
      TZ: "${TZ:-Europe/Stockholm}"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      AUTH_MODE: "${AUTH_MODE:-off}"
      OXYGEN_DEPLOY_REF: "${OXYGEN_DEPLOY_REF:-${OXYGEN_IMAGE:-ghcr.io/open-orienteering/oxygen:stable}}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Automatic whole-database backups (docs/ops/backup-restore.md
  # "Automatic backups"): a pg_dump of the oxygen schema every 15 minutes
  # into ./backups next to this file, the newest 48 kept. Point
  # BACKUP_DIR at a USB stick to keep a copy off the box's disk.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: oxygen
      PGPASSWORD: oxygen
      PGDATABASE: oxygen
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-900}"
      BACKUP_KEEP: "${BACKUP_KEEP:-48}"
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # docker/pg-backup.sh from BACKUP_DIR= on, inline with $ doubled: this
    # file runs without a checkout (a unit test keeps the two the same).
    entrypoint:
      - sh
      - -c
      - |
        BACKUP_DIR="$${BACKUP_DIR:-/backups}"
        INTERVAL="$${BACKUP_INTERVAL_SECONDS:-900}"
        KEEP="$${BACKUP_KEEP:-48}"

        mkdir -p "$$BACKUP_DIR"
        echo "pg-backup: every $${INTERVAL}s to $${BACKUP_DIR}, keeping $${KEEP}"

        free_kb() { df -Pk "$$BACKUP_DIR" | awk 'NR == 2 { print $$4 }'; }

        while true; do
          # A dump cut off by a container stop leaves a .partial behind.
          find "$$BACKUP_DIR" -maxdepth 1 -name 'oxygen_*.dump.partial' -type f -delete
          last="$$(ls -1t "$$BACKUP_DIR"/oxygen_*.dump 2>/dev/null | head -n 1)"
          need_kb=0
          if [ -n "$$last" ]; then need_kb=$$(( $$(wc -c < "$$last") * 2 / 1024 )); fi
          # Make room from the oldest dumps, keeping the newest two.
          while free="$$(free_kb)" && [ -n "$$free" ] && [ "$$free" -lt "$$need_kb" ]; do
            oldest="$$(ls -1t "$$BACKUP_DIR"/oxygen_*.dump 2>/dev/null | tail -n +3 | tail -n 1)"
            [ -n "$$oldest" ] || break
            echo "pg-backup: low on space ($${free} KiB free, need $${need_kb}): deleting $${oldest}"
            rm -f "$$oldest"
          done
          free="$$(free_kb)"
          stamp="$$(date -u +%Y%m%d_%H%M%S)"
          out="$${BACKUP_DIR}/oxygen_$${stamp}.dump"
          # An unknown free space (df failed) does not stop the backups.
          if [ -n "$$free" ] && [ "$$free" -lt "$$need_kb" ]; then
            echo "pg-backup: SKIPPED at $${stamp}: $${free} KiB free in $${BACKUP_DIR}, need $${need_kb}" >&2
          elif pg_dump --schema=oxygen --format=custom --file="$${out}.partial"; then
            mv "$${out}.partial" "$${out}"
            echo "pg-backup: wrote $${out} ($$(wc -c < "$${out}") bytes)"
            # Newest first; drop everything after the first KEEP.
            ls -1t "$$BACKUP_DIR"/oxygen_*.dump 2>/dev/null | tail -n +"$$((KEEP + 1))" | while read -r old; do
              rm -f "$$old"
            done
          else
            echo "pg-backup: pg_dump FAILED at $${stamp}" >&2
            rm -f "$${out}.partial"
          fi
          sleep "$$INTERVAL"
        done

volumes:
  postgres-release-data:
