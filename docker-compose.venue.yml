# Venue-box stack (pivot Step 5): the same Oxygen images that run in the
# cloud, packaged as a self-contained node for a competition venue — its own
# Postgres, the API in venue role (journal shipper dialing the cloud), and
# the nginx-served web UI for LAN stations without internet.
#
# The API listens on :3001 over plain HTTP. No TLS certificate is needed:
# Chrome 142+ Local Network Access lets the HTTPS cloud PWA call the box
# after a one-time permission prompt (see docs/ops/venue-runbook.md).
#
# Required environment (put them in a `.env.venue` next to this file):
#   VENUE_NODE_ID       e.g. "venue-kolmarden-1" — the journal station id
#   SYNC_PEER_URL       the cloud's base URL, e.g. https://oxygen.example.com
#   SYNC_SHARED_SECRET  the same secret configured on the cloud node
#   CLOUD_WEB_ORIGIN    the cloud PWA origin for CORS, usually = SYNC_PEER_URL
#
# Optional, when the cloud is behind IAP (it is, for a deploy made with
# scripts/gcp/deploy.sh; docs/ops/deploy-gcp-cloud-run.md "Venue-box sync
# through IAP"):
#   SYNC_GOOGLE_AUDIENCE  the IAP OAuth client ID
#   VENUE_SA_KEY          path to the service-account key file on this host,
#                         absolute or starting with ./ (a bare name would be
#                         taken as a Docker volume). Mounted read-only into
#                         the api container, which runs as uid 1000 (user
#                         `node`): `chown 1000 <file> && chmod 400 <file>`.
# The api logs at start whether IAP auth is on and warns if only one of the
# two is set or the key cannot be read.
#
# Usage:
#   docker compose -f docker-compose.venue.yml --env-file .env.venue up --build -d
# The `migrate` service applies Prisma migrations before the api starts (and on
# every `up`); there is no separate migrate command. Upgrading the box:
# docs/ops/venue-runbook.md "Upgrading the box".

# Both api and migrate build the same image (layers are shared).
x-api-build: &api-build
  context: .
  target: api

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
      POSTGRES_DB: oxygen
    volumes:
      - venue-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxygen -d oxygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: *api-build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
    command:
      - sh
      - -c
      - cd packages/api && node_modules/.bin/prisma migrate deploy

  api:
    build: *api-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
      PORT: "3001"
      TZ: "${TZ:-Europe/Stockholm}"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # ── Node identity + peering (see packages/api/src/sync/nodeIdentity.ts)
      NODE_ID: "${VENUE_NODE_ID:?set VENUE_NODE_ID}"
      NODE_ROLE: "venue"
      SYNC_PEER_URL: "${SYNC_PEER_URL:?set SYNC_PEER_URL}"
      SYNC_SHARED_SECRET: "${SYNC_SHARED_SECRET:?set SYNC_SHARED_SECRET}"
      # The cloud PWA's origin — stations load the app over HTTPS from the
      # cloud and call this box cross-origin on the LAN.
      CORS_ORIGINS: "${CLOUD_WEB_ORIGIN:-}"
      # IAP in front of the cloud (see the header): audience + key file.
      SYNC_GOOGLE_AUDIENCE: "${SYNC_GOOGLE_AUDIENCE:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${VENUE_SA_KEY:+/run/secrets/venue-sa.json}"
    volumes:
      - "${VENUE_SA_KEY:-/dev/null}:/run/secrets/venue-sa.json:ro"
    # Ready = database reachable and every migration applied (/ready), not just
    # "process is up": the web container and node discovery wait for it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # LAN-served web UI: lets stations work even with zero internet (they
  # browse http://<box-ip>:8080 directly — same origin as nothing, plain
  # HTTP, no LNA needed).
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Automatic whole-database backups (docs/ops/backup-restore.md
  # "Automatic backups"): a pg_dump of the oxygen schema every 15 minutes
  # into ./backups next to this file, the newest 48 kept. Point
  # BACKUP_DIR at a USB stick to keep a copy off the box's disk.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: oxygen
      PGPASSWORD: oxygen
      PGDATABASE: oxygen
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-900}"
      BACKUP_KEEP: "${BACKUP_KEEP:-48}"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/pg-backup.sh"]

volumes:
  venue-pg-data:
