services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
      POSTGRES_DB: oxygen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxygen -d oxygen"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oxygen:oxygen@postgres:5432/oxygen?schema=oxygen"
      PORT: "3001"
      HOST: "0.0.0.0"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      target: web
      network: host
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
