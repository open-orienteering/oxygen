server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    # tRPC JSON.parse()s every response. Default nginx error pages are HTML
    # (`<html><head>…`) and show up as "Unexpected token '<'".
    error_page 413 = @nginx_json_413;
    error_page 502 = @nginx_json_502;
    error_page 504 = @nginx_json_504;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy tRPC and API requests to the backend on localhost (host network mode)
    location /trpc {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: serve index.html for all non-file routes
    # Never cache index.html so browsers always get the latest asset hashes after a deploy
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets aggressively (they have content hashes)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @nginx_json_413 {
        default_type application/json;
        return 413 '{"message":"Upload is too large for the server."}';
    }
    location @nginx_json_502 {
        default_type application/json;
        return 502 '{"message":"The server timed out or crashed while handling the upload."}';
    }
    location @nginx_json_504 {
        default_type application/json;
        return 504 '{"message":"The server timed out or crashed while handling the upload."}';
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
