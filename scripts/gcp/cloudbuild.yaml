# Cloud Build config: builds the single-container `cloud` Dockerfile target
# and pushes it to Artifact Registry. Invoked only by
# `deploy.sh --from-source` (unreleased local tree). Normal deploys pull
# `ghcr.io/open-orienteering/oxygen` instead.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=cloud
      - --build-arg
      - BUILD_ID=${_BUILD_ID}
      - --build-arg
      - BUILD_REF=source-${_BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:latest
substitutions:
  _BUILD_ID: ""
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
